services:
  voice-assistant:
    build: .
    image: voice-assistant
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - API_SERVER_KEY=${API_SERVER_KEY}
      - API_SERVER_HOST=${API_SERVER_HOST}
      - API_SERVER_PORT=${API_SERVER_PORT}
      - BRAIN_MODEL=${BRAIN_MODEL}
      - TTS_VOICE=${TTS_VOICE}
    networks:
      - coolify

networks:
  coolify:
    external: true
