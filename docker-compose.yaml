services:
  voice-assistant:
    build: .
    image: voice-assistant:latest
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - coolify
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - API_SERVER_KEY=${API_SERVER_KEY}
      - API_SERVER_HOST=${API_SERVER_HOST}
      - API_SERVER_PORT=${API_SERVER_PORT}
      - BRAIN_MODEL=${BRAIN_MODEL}
      - TTS_VOICE=${TTS_VOICE}

networks:
  coolify:
    external: true
