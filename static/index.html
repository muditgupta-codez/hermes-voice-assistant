<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hermes Voice</title>
<style>
:root {
  --bg: #0a0b10;
  --bg2: #10121c;
  --card: #131622;
  --card2: #10131c;
  --ink: #e8ecf6;
  --ink-dim: #8b93a8;
  --ink-faint: #5a6175;
  --accent: #6c7bff;
  --accent2: #9a7bff;
  --green: #4fe08a;
  --red: #ff6b6b;
  --line: rgba(255,255,255,.07);
  --radius: 20px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: radial-gradient(1000px 700px at 30% -10%, #1a1c3a 0%, var(--bg) 55%);
  color: var(--ink);
  display: flex; flex-direction: column; align-items: center;
  height: 100%; height: 100dvh; overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ---- header: slim, fixed ---- */
header {
  width: 100%; max-width: 720px;
  padding: 14px 20px 10px;
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo .orb {
  width: 30px; height: 30px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, var(--accent), var(--accent2));
  box-shadow: 0 0 18px var(--accent); animation: pulse 3s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{transform:scale(1);opacity:.9} 50%{transform:scale(1.1);opacity:1} }
.logo h1 { font-size: 17px; font-weight: 600; letter-spacing: .2px; line-height: 1.1; }
.logo .sub { font-size: 10px; color: var(--ink-dim); letter-spacing: .3px; }
.status {
  font-size: 11.5px; padding: 5px 11px; border-radius: 20px; white-space: nowrap;
  background: rgba(255,255,255,.04); color: var(--ink-dim);
  border: 1px solid var(--line);
}
.status.on { color: var(--green); border-color: rgba(79,224,138,.4); }
.status.err { color: var(--red); border-color: rgba(255,107,107,.4); }

/* ---- main: fills remaining height ---- */
main {
  width: 100%; max-width: 720px; flex: 1; min-height: 0;
  padding: 0 20px 16px; display: flex; flex-direction: column;
}
.stage {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.4);
}

/* ---- mic capture: compact top block ---- */
.mic-capture { flex-shrink: 0; padding: 14px 16px 8px; border-bottom: 1px solid var(--line); }
.waveform { height: 30px; display: flex; align-items: center; justify-content: center; gap: 2px; }
.waveform span { width: 3px; border-radius: 2px; background: var(--accent); height: 4px; transition: height .08s; }
.listening-line { font-size: 12px; color: var(--green); min-height: 15px; text-align: center; margin: 2px 0 8px; }
.mic-row { display: flex; align-items: center; justify-content: center; gap: 14px; }
.pulse-ring { position: relative; width: 62px; height: 62px; flex-shrink: 0; }
.pulse-ring .ring {
  position: absolute; inset: 0; border-radius: 50%;
  border: 2px solid var(--accent); opacity: .22; transition: transform .5s, opacity .5s;
}
.mic-btn {
  position: absolute; inset: 7px; border-radius: 50%; border: none; cursor: pointer;
  background: linear-gradient(145deg, #23283a, #14161f);
  box-shadow: 0 6px 18px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
  display: flex; align-items: center; justify-content: center;
  transition: transform .15s, box-shadow .2s, background .2s;
}
.mic-btn svg { width: 24px; height: 24px; fill: var(--ink-dim); transition: fill .2s; }
.mic-btn:hover { transform: scale(1.06); }
.mic-btn:active { transform: scale(.94); }
.mic-btn.rec {
  background: linear-gradient(145deg, var(--accent), var(--accent2));
  box-shadow: 0 6px 24px rgba(108,123,255,.55);
}
.mic-btn.rec svg { fill: #fff; }
.mic-btn.rec ~ .ring { animation: ripple 1.2s infinite; border-color: var(--accent2); opacity: .5; }
@keyframes ripple { 0%{transform:scale(1);opacity:.5} 100%{transform:scale(1.6);opacity:0} }
.mic-cta { font-size: 13px; color: var(--ink-dim); }
.mic-cta strong { color: var(--ink); }
/* control row: one tidy line */
.controls { display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.voice-pick, .action {
  background: rgba(255,255,255,.04); border: 1px solid var(--line);
  color: var(--ink); padding: 6px 12px; border-radius: 11px; font-size: 12.5px; cursor: pointer;
  transition: background .15s;
}
.voice-pick:hover, .action:hover { background: rgba(255,255,255,.08); }
.voice-pick { max-width: 180px; }

/* ---- conversation: the hero, scrolls ---- */
.conv { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 18px 16px; }
.conv::-webkit-scrollbar { width: 8px; }
.conv::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 8px; }
.empty-hint {
  margin: auto; text-align: center; color: var(--ink-faint); font-size: 13px; line-height: 1.6;
  max-width: 240px; pointer-events: none;
}
.empty-hint b { color: var(--ink-dim); display: block; margin-bottom: 4px; }
.bubble { max-width: 84%; padding: 10px 15px; border-radius: 16px; font-size: 14.5px; line-height: 1.5; opacity: 0; transform: translateY(6px); animation: in .25s forwards; }
@keyframes in { to{opacity:1; transform:none} }
.bubble.user { align-self: flex-end; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border-bottom-right-radius: 5px; }
.bubble.ai { align-self: flex-start; background: rgba(255,255,255,.05); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
.bubble .who { font-size: 10px; text-transform: uppercase; letter-spacing: .7px; color: var(--ink-dim); margin-bottom: 3px; }
.bubble.ai .who { color: #b9b3ff; }

/* ---- session panel ---- */
.session-panel, .msg-wrap { flex-shrink: 0; }
.session-panel {
  background: var(--card2); border-top: 1px solid var(--line);
  padding: 12px 16px; max-height: 46%; overflow: hidden; display: flex; flex-direction: column;
}
.panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.panel-head span { font-weight: 600; font-size: 14px; }
.panel-actions { display: flex; gap: 6px; }
.session-list { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 2px; }
.session-list::-webkit-scrollbar { width: 6px; }
.session-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 6px; }
.session-item { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 11px; background: rgba(255,255,255,.03); border: 1px solid var(--line); cursor: pointer; transition: background .15s, border-color .15s; }
.session-item:hover { background: rgba(255,255,255,.06); }
.session-item.active { border-color: var(--accent); background: rgba(108,123,255,.12); }
.session-item .s-main { flex: 1; min-width: 0; }
.session-item .s-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.session-item .s-meta { font-size: 11px; color: var(--ink-dim); margin-top: 1px; }
.session-item .s-del { flex-shrink: 0; background: transparent; border: 1px solid rgba(255,107,107,.4); color: var(--red); border-radius: 8px; padding: 4px 9px; font-size: 11.5px; cursor: pointer; transition: background .15s; }
.session-item .s-del:hover { background: rgba(255,107,107,.15); }
.session-empty { padding: 18px; text-align: center; color: var(--ink-dim); font-size: 12.5px; }
.session-hint { margin-top: 8px; font-size: 11px; color: var(--ink-dim); text-align: center; }
.session-hint strong { color: var(--ink); }

/* ---- inline status / error msg ---- */
.msg-wrap { padding: 6px 16px 4px; min-height: 26px; display: flex; align-items: center; justify-content: center; }
.msg { font-size: 12px; color: var(--ink-dim); text-align: center; }
.msg.err { color: var(--red); }

/* ---- composer: the hero input, pinned at bottom ---- */
.typebar {
  flex-shrink: 0; display: flex; align-items: flex-end; gap: 8px;
  padding: 10px 12px; margin: 0 16px 6px;
  background: var(--card2); border: 1px solid var(--line); border-radius: 16px;
  transition: border-color .15s, box-shadow .15s;
}
.typebar:focus-within { border-color: rgba(108,123,255,.5); box-shadow: 0 0 0 3px rgba(108,123,255,.12); }
.typebar textarea {
  flex: 1; resize: none; border: none; outline: none; background: transparent;
  color: var(--ink); font: inherit; font-size: 15px; line-height: 1.4;
  max-height: 110px; max-height: 40vh; padding: 7px 0;
}
.typebar textarea::placeholder { color: var(--ink-faint); }
#sendBtn {
  flex-shrink: 0; width: 40px; height: 40px; border-radius: 12px; border: none; cursor: pointer;
  background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
  display: flex; align-items: center; justify-content: center;
  transition: transform .15s, opacity .2s, filter .15s;
}
#sendBtn svg { width: 18px; height: 18px; fill: #fff; }
#sendBtn:hover { transform: scale(1.06); }
#sendBtn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

footer { flex-shrink: 0; font-size: 10.5px; color: var(--ink-faint); text-align: center; padding: 6px 0 10px; }
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="orb"></div>
    <div>
      <h1>Hermes Voice</h1>
      <div class="sub">speak · think · reply</div>
    </div>
  </div>
  <div class="status" id="status">…</div>
</header>

<main>
  <div class="stage">
    <div class="mic-capture">
      <div class="waveform" id="wf"></div>
      <div class="listening-line" id="listen"></div>
      <div class="mic-row">
        <div class="pulse-ring">
          <div class="ring"></div>
          <button class="mic-btn" id="micBtn" aria-label="Hold to talk">
            <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.92V21H8a1 1 0 1 0 0 2h8a1 1 0 1 0 0-2h-3v-3.08A7 7 0 0 0 19 11z"/></svg>
          </button>
        </div>
        <div class="mic-cta"><strong>Hold</strong> the mic, or <strong>type</strong> below</div>
      </div>
      <div class="controls">
        <select id="voice" class="voice-pick" title="Voice"></select>
        <button class="action" id="autoSpeak">🔊 Auto-speak: On</button>
        <button class="action" id="sessionsBtn">🗂 Sessions</button>
      </div>
    </div>

    <div class="conv" id="conv">
      <div class="empty-hint"><b>Chat with Hermes</b>Hold the mic to talk,<br>or type a message below.</div>
    </div>

    <div class="msg-wrap"><div class="msg" id="msg"></div></div>

    <div class="typebar" id="typeBar" style="display:none">
      <textarea id="typeInput" placeholder="Type a message…" rows="1"></textarea>
      <button id="sendBtn" aria-label="Send">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>

    <div class="session-panel" id="sessionPanel" style="display:none">
      <div class="panel-head">
        <span>Past sessions</span>
        <div class="panel-actions">
          <button class="action" id="refreshSessions">↻ Refresh</button>
          <button class="action" id="closeSessions">✕ Close</button>
        </div>
      </div>
      <div class="session-list" id="sessionList"></div>
      <div class="session-hint">Select a session to <strong>resume</strong> it · <strong>Delete</strong> removes it permanently.</div>
    </div>
  </div>
</main>

<footer>Powered by Hermes agent · Groq STT · edge-tts</footer>

<script>
const API = location.origin;
const conv = document.getElementById('conv');
const msgEl = document.getElementById('msg');
const statusEl = document.getElementById('status');
const micBtn = document.getElementById('micBtn');
const wf = document.getElementById('wf');
const listenEl = document.getElementById('listen');
const voicePick = document.getElementById('voice');
const autoSpeakBtn = document.getElementById('autoSpeak');
const typeInput = document.getElementById('typeInput');
const sendBtn = document.getElementById('sendBtn');
const typeBar = document.getElementById('typeBar');
const sessionsBtn = document.getElementById('sessionsBtn');
const sessionPanel = document.getElementById('sessionPanel');
const sessionList = document.getElementById('sessionList');
const refreshSessions = document.getElementById('refreshSessions');
const closeSessions = document.getElementById('closeSessions');

// current session id — the one new messages go to
let currentSessionId = (()=>{ let s = localStorage.getItem('hsess'); if (!s) { s = 'v_'+crypto.randomUUID(); localStorage.setItem('hsess', s); } return s; })();

let autoSpeak = true;
let recording = false, recTimeout = null;
let mediaRec = null, chunks = [], stream = null;
let isBusy = false;
let starting = false;
let pressed = false;

// --- audio playback (persistent element + autoplay unlock) ---
const audioEl = new Audio();
const SILENT_WAV = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAIlYAAESsAAACABAAZGF0YQAAAAA=";
let audioUnlocked = false;
function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  audioEl.src = SILENT_WAV;
  audioEl.play().then(() => { audioEl.pause(); audioEl.currentTime = 0; }).catch(() => {});
}
document.addEventListener('pointerdown', unlockAudio);
document.addEventListener('touchstart', unlockAudio, {passive:true});
document.addEventListener('keydown', unlockAudio);

// --- barge-in interrupt ---
let currentAbort = null;
let speaking = false;

function stopSpeaking() {
  speaking = false;
  try { audioEl.pause(); audioEl.currentTime = 0; } catch(e){}
  const src = audioEl.src;
  if (src && src.startsWith('blob:')) { try { URL.revokeObjectURL(src); } catch(e){} }
  audioEl.src = SILENT_WAV;
  if (!recording) setStatus('Mic ready', 'on');
}

function interrupt() {
  if (currentAbort) { try { currentAbort.abort(); } catch(e){} currentAbort = null; }
  stopSpeaking();
  clearThinking();
  isBusy = false;
}

const VOICES = ['en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-GB-RyanNeural','en-GB-SoniaNeural','en-IN-NeerjaNeural','en-IN-PrabhatNeural','hi-IN-SwaraNeural'];

function clearEmptyHint() {
  const eh = conv.querySelector('.empty-hint');
  if (eh) eh.remove();
}

function addBubble(text, who) {
  clearEmptyHint();
  const b = document.createElement('div');
  b.className = 'bubble ' + who;
  b.innerHTML = `<div class="who">${who==='user'?'You':'Hermes'}</div><div>${text}</div>`;
  conv.appendChild(b);
  conv.scrollTop = conv.scrollHeight;
  return b;
}
function escapeHtml(s) {
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function setStatus(t, cls) { statusEl.textContent = t; statusEl.className = 'status' + (cls?' '+cls:''); }
function setThinking() {
  statusEl.textContent = 'Thinking';
  statusEl.className = 'status on';
  let n = 0;
  if (statusEl._think) clearInterval(statusEl._think);
  statusEl._think = setInterval(()=>{
    n = (n+1) % 4;
    statusEl.textContent = 'Thinking' + '.'.repeat(n);
  }, 450);
}
function clearThinking() {
  if (statusEl._think) { clearInterval(statusEl._think); statusEl._think = null; }
}
function setMsg(t, cls) { msgEl.textContent = t; msgEl.className = 'msg' + (cls?' '+cls:''); }

// waveform
for (let i=0;i<28;i++){ const s=document.createElement('span'); wf.appendChild(s); }
const wfBars = wf.children;
function drawWave(levels) {
  for (let i=0;i<wfBars.length;i++){
    const v = levels && levels[i] ? Math.min(1, levels[i]) : 0.05;
    wfBars[i].style.height = (4 + v*24) + 'px';
  }
}

// voices
VOICES.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v; voicePick.appendChild(o); });
voicePick.value = 'en-US-AriaNeural';

// status + mic
async function initMic() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
    setStatus('Mic ready', 'on');
    micBtn.disabled = false;
  } catch(e) {
    // one concise status note — the typebar is always available below
    setStatus('Mic blocked — type below', 'err');
    showTypeBar(true);
    typeInput.focus();
  }
}

micBtn.addEventListener('mousedown', ()=>{ pressed=true; interrupt(); startRec(); });
micBtn.addEventListener('touchstart', e=>{e.preventDefault(); pressed=true; unlockAudio(); interrupt(); startRec();}, {passive:false});
function endRec(){ pressed=false; if (recording) stopRec(); }
micBtn.addEventListener('mouseup', endRec);
micBtn.addEventListener('mouseleave', endRec);
micBtn.addEventListener('touchend', e=>{e.preventDefault(); endRec();}, {passive:false});
micBtn.addEventListener('mousedown', unlockAudio);

async function startRec() {
  if (isBusy) return;
  if (starting || recording) return;
  if (!stream || !stream.getAudioTracks().find(t=>t.readyState==='live')) {
    starting = true;
    try {
      stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
      if (!pressed) { starting = false; return; }
    }
    catch(e){ starting = false; setMsg('Mic unavailable — type below', 'err'); return; }
    starting = false;
  }
  chunks = [];
  const preferred = ['audio/webm,codecs=opus','audio/webm','audio/mp4','audio/mp4;codecs=mp4a.40.2','audio/ogg'];
  let mime = '';
  for (const m of preferred) { if (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported(m)) { mime = m; break; } }
  mediaRec = new MediaRecorder(stream, mime ? {mimeType: mime} : undefined);
  mediaRec.ondataavailable = e => { if (e.data.size>0) chunks.push(e.data); };
  mediaRec.onstop = onRecStop;
  mediaRec.start();
  recording = true;
  micBtn.classList.add('rec');
  listenEl.textContent = 'Listening…';
  recTimeout = setTimeout(()=>{ if (recording) stopRec(); }, 12000);
  const ctx = new AudioContext();
  if (ctx.state === 'suspended') { try { await ctx.resume(); } catch(e){} }
  const src = ctx.createMediaStreamSource(stream);
  const ana = ctx.createAnalyser(); ana.fftSize = 256;
  src.connect(ana);
  const data = new Uint8Array(ana.frequencyBinCount);
  (function loop(){
    if (!recording) { ctx.close(); return; }
    ana.getByteFrequencyData(data);
    const levels = [];
    for (let i=0;i<wfBars.length;i++){
      const idx = Math.floor(i/wfBars.length * data.length);
      levels.push(data[idx]/255);
    }
    drawWave(levels);
    requestAnimationFrame(loop);
  })();
}

function stopRec(){
  if (!recording) return;
  recording = false;
  clearTimeout(recTimeout);
  try { mediaRec.stop(); } catch(e){}
  micBtn.classList.remove('rec');
  listenEl.textContent = '';
  drawWave(null);
  if (stream) stream.getAudioTracks().forEach(t=>{ try{ t.stop(); }catch(e){} });
}

async function onRecStop() {
  const blob = new Blob(chunks, {type: mediaRec.mimeType || 'audio/webm'});
  if (blob.size < 1000) { setMsg('Too short — hold a moment after you speak.'); isBusy=false; setStatus('Mic ready','on'); return; }
  await processAudio(blob);
}

async function processAudio(blob) {
  isBusy = true;
  setStatus('Transcribing…');
  try {
    const mime = (mediaRec && mediaRec.mimeType) || blob.type || 'audio/webm';
    let ext = 'webm';
    if (mime.includes('mp4') || mime.includes('m4a')) ext = 'm4a';
    else if (mime.includes('ogg')) ext = 'ogg';
    else if (mime.includes('wav')) ext = 'wav';
    const fd = new FormData();
    fd.append('file', blob, 'audio.' + ext);
    const s = await fetch(API + '/stt', {method:'POST', body:fd});
    if (!s.ok) throw new Error('STT ' + s.status);
    const sj = await s.json();
    const text = sj.text.trim();
    if (!text) { setMsg('Didn’t catch that — try again.'); isBusy=false; setStatus('Mic ready','on'); return; }
    addBubble(text, 'user');
    await doBrain(text);
  } catch(e) {
    setMsg('Error: ' + e.message, 'err');
    setStatus('Mic ready', 'on');
    isBusy = false;
  }
}

async function doBrain(text) {
  setThinking();
  currentAbort = new AbortController();
  try {
    const r = await fetch(API + '/brain', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({text, session_id: currentSessionId}), signal: currentAbort.signal});
    if (!r.ok) throw new Error('Brain ' + r.status);
    const rj = await r.json();
    const reply = (rj.reply || '').trim();
    addBubble(reply, 'ai');
    if (autoSpeak) await speak(reply);
  } catch(e) {
    if (e.name !== 'AbortError') setMsg('Error: ' + e.message, 'err');
  }
  clearThinking();
  isBusy = false;
  setStatus('Mic ready', 'on');
}

async function speak(text) {
  setStatus('Speaking…');
  speaking = true;
  currentAbort = currentAbort || new AbortController();
  try {
    const r = await fetch(API + '/tts', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({text, session_id: currentSessionId}), signal: currentAbort.signal});
    if (!r.ok) throw new Error('TTS ' + r.status);
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    audioEl.src = url;
    audioEl.onended = () => { URL.revokeObjectURL(url); if (!recording) setStatus('Mic ready','on'); speaking=false; };
    await audioEl.play();
    speaking = false;
  } catch(e) {
    if (e.name !== 'AbortError') setMsg('TTS error: ' + e.message, 'err');
    setStatus('Mic ready', 'on');
  }
}

autoSpeakBtn.addEventListener('click', ()=>{ autoSpeak=!autoSpeak; autoSpeakBtn.textContent = '🔊 Auto-speak: ' + (autoSpeak?'On':'Off'); });
voicePick.addEventListener('change', ()=>{ /* toggle server uses default; could pass voice via /tts */ });

// keyboard: space to talk while focus elsewhere
document.addEventListener('keydown', async e=>{
  if (e.code==='Space' && document.activeElement!==typeInput && !e.repeat && !isBusy) { e.preventDefault(); pressed=true; interrupt(); if (!stream) await initMic(); startRec(); }
});
document.addEventListener('keyup', e=>{ if (e.code==='Space') { pressed=false; endRec(); } });

// ---- text input (always available) ----
function showTypeBar(show) {
  typeBar.style.display = show ? 'flex' : 'none';
  if (show) typeInput.focus();
}
// Always show the type bar on load (don't gate it behind mic failure anymore).
window.addEventListener('load', ()=> showTypeBar(true));
if (window.innerWidth <= 768) showTypeBar(true);

function autoGrow() {
  typeInput.style.height = 'auto';
  typeInput.style.height = Math.min(typeInput.scrollHeight, 110) + 'px';
}
typeInput.addEventListener('input', autoGrow);
typeInput.addEventListener('keydown', e=>{
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendTyped(); }
});
sendBtn.addEventListener('click', sendTyped);

async function sendTyped() {
  const t = typeInput.value.trim();
  if (!t) return;
  typeInput.value=''; autoGrow(); sendBtn.disabled = true;
  addBubble(t,'user');
  await doBrain(t);
  sendBtn.disabled = false;
  typeInput.focus();
}

// ---- session history panel ----
function fmtWhen(ts){
  if (!ts) return '';
  const d = new Date(ts);
  if (isNaN(d)) return '';
  const now = new Date();
  const ms = now - d;
  if (ms < 60000) return 'just now';
  if (ms < 3600000) return Math.floor(ms/60000)+'m ago';
  if (ms < 86400000) return Math.floor(ms/3600000)+'h ago';
  return d.toLocaleDateString(undefined, {month:'short', day:'numeric'}) + ' ' + d.toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit'});
}

async function fetchSessions() {
  try {
    const r = await fetch(API + '/api/sessions?limit=100');
    if (!r.ok) throw new Error('list ' + r.status);
    const j = await r.json();
    return j.data || [];
  } catch(e){ setMsg('Failed to load sessions: '+e.message, 'err'); return []; }
}

function renderSessions(sessions) {
  if (!sessions.length) { sessionList.innerHTML = '<div class="session-empty">No past sessions yet — start talking or typing.</div>'; return; }
  sessionList.innerHTML = '';
  sessions.forEach(s=>{
    const title = s.title && s.title.trim() ? s.title : s.id;
    const item = document.createElement('div');
    item.className = 'session-item' + (s.id===currentSessionId ? ' active' : '');
    item.innerHTML = `
      <div class="s-main" title="${escapeHtml(title)}">
        <div class="s-title">${escapeHtml(title)}</div>
        <div class="s-meta">${s.message_count||0} msgs · ${fmtWhen(s.last_active||s.started_at)}</div>
      </div>
      <button class="s-del" title="Delete session">Delete</button>`;
    item.addEventListener('click', ()=> resumeSession(s));
    const delBtn = item.querySelector('.s-del');
    delBtn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if (!confirm('Delete this session? Its history will be removed permanently.')) return;
      delBtn.disabled = true; delBtn.textContent = '…';
      try {
        const dr = await fetch(API + '/api/sessions/' + encodeURIComponent(s.id), {method:'DELETE'});
        if (!dr.ok) throw new Error('delete ' + dr.status);
        if (s.id === currentSessionId) { startNewSession(); }
        await loadSessions();
      } catch(err){ setMsg('Delete failed: '+err.message,'err'); delBtn.disabled=false; delBtn.textContent='Delete'; }
    });
    sessionList.appendChild(item);
  });
}

async function loadSessions() {
  const sessions = await fetchSessions();
  renderSessions(sessions);
}

async function resumeSession(s) {
  currentSessionId = s.id;
  localStorage.setItem('hsess', s.id);
  conv.innerHTML = '';
  try {
    const r = await fetch(API + '/api/sessions/' + encodeURIComponent(s.id) + '/messages?limit=300');
    if (!r.ok) throw new Error('msgs ' + r.status);
    const j = await r.json();
    const arr = (j.data || []);
    let shown = 0;
    for (const m of arr) {
      const role = m.role;
      if (role !== 'user' && role !== 'assistant') continue;
      let text = m.content;
      if (Array.isArray(text)) text = text.map(p=> p && p.text ? p.text : '').join(' ');
      if (!text || !text.trim()) continue;
      addBubble(text.trim(), role==='user'?'user':'ai');
      shown++;
    }
    if (!shown) addBubble('(empty session)','ai');
  } catch(e){ setMsg('Failed to load history: '+e.message,'err'); }
  await loadSessions();
  setMsg('');
}

function startNewSession() {
  currentSessionId = 'v_' + crypto.randomUUID();
  localStorage.setItem('hsess', currentSessionId);
  conv.innerHTML = '';
  typeInput.focus();
}

// panel open/close
sessionsBtn.addEventListener('click', async ()=>{
  const open = sessionPanel.style.display !== 'none';
  if (open) { sessionPanel.style.display = 'none'; sessionsBtn.textContent = '🗂 Sessions'; }
  else { sessionPanel.style.display = 'block'; sessionsBtn.textContent = '🗂 Close'; await loadSessions(); }
});
refreshSessions.addEventListener('click', loadSessions);
closeSessions.addEventListener('click', ()=>{ sessionPanel.style.display='none'; sessionsBtn.textContent='🗂 Sessions'; });

// health + init
async function boot(){
  try {
    const r = await fetch(API + '/health');
    if (!r.ok) throw new Error('health ' + r.status);
    const j = await r.json();
    setStatus('Connected', 'on');
  } catch(e){ setStatus('Offline', 'err'); }
  await initMic();
}
boot();
</script>
